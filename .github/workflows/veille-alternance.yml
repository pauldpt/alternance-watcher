name: Veille alternance

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LBA_API_TOKEN: ${{ secrets.LBA_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REQUIRE_PERSISTENT_DB: "true"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
      REQUIRE_DISCORD: "true"
      DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
      DISCORD_USERNAME: "Veille Alternance"
      OUTPUT_DIR: ./out
      SEARCH_DEPARTEMENTS: "75,92,93,94,91,78,77,95"
      TARGET_DIPLOMA_LEVEL: "6"
      ROME_CODES: "M1801,M1802,M1805,M1806,M1810,M1403"
      MIN_SCORE: "18"
      INCLUDE_BROAD_SEARCH: "false"
      INCLUDE_EXTERNAL_LINKS: "true"
      INCLUDE_DIRECT_CAREERS: "true"
      EXTERNAL_SEARCH_LOCATION: "France"
      EXTERNAL_SEARCH_QUERIES: "alternance devops cloud,alternance data engineer,alternance infrastructure cloud"
      SMTP_HOST: ""
      EMAIL_TO: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run local checks
        run: |
          python offres_alternance.py --self-test
          python -m py_compile offres_alternance.py

      - name: Check cloud secrets
        run: |
          if [ -z "$LBA_API_TOKEN" ]; then
            echo "::notice::Secret LBA_API_TOKEN manquant. La veille cloud est ignoree."
            echo "RUN_WATCHER=false" >> "$GITHUB_ENV"
          elif [ -z "$DATABASE_URL" ]; then
            echo "::notice::Secret DATABASE_URL manquant. La veille cloud est ignoree."
            echo "RUN_WATCHER=false" >> "$GITHUB_ENV"
          elif [ -z "$DISCORD_WEBHOOK_URL" ] && [ -z "$DISCORD_WEBHOOK_URLS" ]; then
            echo "::notice::Secret DISCORD_WEBHOOK_URL ou DISCORD_WEBHOOK_URLS manquant. La veille cloud est ignoree."
            echo "RUN_WATCHER=false" >> "$GITHUB_ENV"
          else
            echo "RUN_WATCHER=true" >> "$GITHUB_ENV"
          fi

      - name: Run watcher
        if: env.RUN_WATCHER == 'true'
        run: python offres_alternance.py --no-email

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offres-alternance-report
          path: out/
          if-no-files-found: ignore
